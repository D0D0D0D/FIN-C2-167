[project]
name = "fin-c2-167"
version = "1.0.0"
description = "Corporate Bond Prospectus Disclosure-Control Diff Review Agent — AgentCore Template"
requires-python = ">=3.11"
# The framework (agenticstar-agentcore) is NOT a public-PyPI dependency; it is
# supplied by the platform's own package registry at build time. Pinning it here
# would make `pip install -e .` fail because it is not resolvable from the
# default index.
dependencies = [
    "agenticstar-agentcore[marketplace,openai]==1.0.3",
    "openpyxl==3.1.5",   # xlsx ingest sanitization/parse (ingest-file-sanitizer part)
    "defusedxml==0.7.1",  # docx XML XXE-safe parse (ingest-file-sanitizer part)
    "PyYAML==6.0.1",      # config/*.yaml (taxonomy, lexicon, ingest_mapping, report_templates)
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-cov==5.0.0",
    "pytest-asyncio==1.4.0",
    "ruff==0.4.4",
    "mypy==1.10.0",
]

[build-system]
requires = ["setuptools==68.0.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
